<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vienna Stay Apartments</title>
<style>
:root{
  --brand:#8a7d6b;--brand-dark:#6d6153;--brand-darker:#554c41;
  --cream:#faf8f5;--beige:#f1ece4;--beige-line:#e4ddd1;--ink:#2c2822;--muted:#7a7266;
  --danger:#c0562f;--danger-dark:#9e4525;--ok:#4b7a52;--teal:#2f9e8f;--radius:12px;--shadow:0 4px 20px rgba(70,60,48,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);line-height:1.5}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px}
.container{max-width:1080px;margin:0 auto;padding:0 20px}
.site-header{background:var(--brand);color:#fff}
.site-header .container{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-mark{width:40px;height:40px;border:2px solid #fff;border-radius:6px;display:grid;place-items:center;font-size:20px}
.logo-text .l1{font-family:Georgia,serif;font-size:18px;font-weight:700;letter-spacing:1px;display:block;line-height:1.1}
.logo-text .l2{font-size:11px;letter-spacing:3px;opacity:.85;text-transform:uppercase}
.nav a{color:#fff;text-decoration:none;margin-left:22px;font-size:15px;opacity:.92;cursor:pointer}
.nav a:hover{opacity:1;text-decoration:underline}
.langsw{margin-left:20px;border-left:1px solid rgba(255,255,255,.3);padding-left:14px}
.langsw a{margin-left:8px;font-size:13px;opacity:.8}
.langsw a.on{opacity:1;font-weight:700;text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--brand-dark)}
.btn:disabled{background:#c9c2b6;cursor:not-allowed}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-ghost{background:transparent;color:var(--brand-dark);border:1px solid var(--beige-line)}
.btn-ghost:hover{background:var(--beige)}
.btn-danger{background:var(--danger)}.btn-danger:hover{background:var(--danger-dark)}
.btn-block{width:100%}
.card{background:#fff;border:1px solid var(--beige-line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.hero{background:linear-gradient(rgba(85,76,65,.55),rgba(85,76,65,.55)),url('https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=1600&q=70');background-size:cover;background-position:center;color:#fff;padding:72px 0 84px}
.hero h1{font-size:44px;margin:0 0 10px}.hero p{font-size:18px;opacity:.95;margin:0}
.searchbox{background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-top:28px;display:grid;grid-template-columns:1fr 1fr .7fr auto;gap:14px;align-items:end}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--beige-line);border-radius:9px;font-size:15px;background:var(--cream);color:var(--ink)}
.datebox{width:100%;padding:11px 12px;border:1px solid var(--beige-line);border-radius:9px;font-size:15px;background:var(--cream);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.datebox .cal-ic{font-size:13px;opacity:.7}
.cal-pop{position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border:1px solid var(--beige-line);border-radius:12px;box-shadow:var(--shadow);padding:12px;z-index:60;width:282px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-family:Georgia,serif;color:var(--ink)}
.cal-head button{border:none;background:var(--beige);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:17px;color:var(--brand-dark)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cwd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cd{text-align:center;padding:7px 0;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink)}
.cd:hover:not(.dis):not(.empty){background:var(--beige)}
.cd.sel{background:var(--brand);color:#fff;font-weight:700}
.cd.dis{color:#cfc7ba;cursor:default}
.cd.empty{cursor:default}
.nights-pill{background:var(--beige);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--brand-dark);display:inline-block;margin-top:10px}
.helper{color:var(--danger);font-size:13px;margin-top:10px}
.section{padding:40px 0}.section h2{font-size:28px;margin:0 0 6px}.section .sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.unit-card img{width:100%;height:190px;object-fit:cover;display:block}
.unit-card .body{padding:16px}.unit-card h3{margin:0 0 6px;font-size:20px}
.unit-card .desc{color:var(--muted);font-size:14px;margin:0 0 14px;min-height:40px}
.price-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.price-row .per{color:var(--muted);font-size:13px}.price-row .total{font-weight:700;font-size:17px}
.combo-badge{display:inline-block;background:var(--teal);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.combo-imgs{display:flex}.combo-imgs img{width:50%;height:150px;object-fit:cover}
.chip{display:inline-block;background:var(--beige);color:var(--brand-dark);border-radius:999px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
.summary-bar{background:var(--beige);border:1px solid var(--beige-line);border-radius:10px;padding:12px 16px;margin:22px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.pad{padding:22px}.gallery{width:100%;height:340px;object-fit:cover;border-radius:12px}
.muted{color:var(--muted)}.stack>*+*{margin-top:12px}.divider{height:1px;background:var(--beige-line);margin:16px 0}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--beige);border:1px solid var(--beige-line);color:var(--brand-dark);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.timer.warn{background:#f7e3d6;border-color:#eac3ab;color:var(--danger-dark)}
.timer.expired{background:#f3d2c6}
.breakdown{font-size:15px}.breakdown .line{display:flex;justify-content:space-between;padding:5px 0}
.breakdown .discount{color:var(--ok)}
.breakdown .grand{border-top:1px solid var(--beige-line);margin-top:8px;padding-top:10px;font-weight:700;font-size:18px}
.promo-row{display:flex;gap:8px}
.promo-row input{flex:1;padding:10px 12px;border:1px solid var(--beige-line);border-radius:9px;background:var(--cream)}
.inline-error{color:var(--danger);font-size:13px;margin-top:6px}.inline-ok{color:var(--ok);font-size:13px;margin-top:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.confirmed{background:#e2efe3;color:var(--ok)}.badge.cancelled{background:#f3d9cf;color:var(--danger-dark)}
.badge.soft_locked{background:#efe7d6;color:#8a6d1f}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty .icon{font-size:46px;margin-bottom:10px}
.notice{background:#f7e3d6;border:1px solid #eac3ab;color:var(--danger-dark);border-radius:10px;padding:14px 16px;font-size:14px}
.site-footer{background:var(--brand-darker);color:#e9e2d8;margin-top:50px;padding:26px 0;font-size:14px}
.site-footer .container{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.site-footer a{color:#fff;cursor:pointer;text-decoration:underline}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
input.ctrl,select.ctrl{width:100%;padding:11px 12px;border:1px solid var(--beige-line);border-radius:9px;font-size:15px;background:var(--cream);color:var(--ink)}
label.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
/* ADMIN */
.admin-top{background:var(--brand-darker);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.admin-top .brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;letter-spacing:1px}
.admin-top a{color:#e9e2d8;cursor:pointer;text-decoration:none;font-size:14px;margin-left:18px}
.admin-top a:hover{color:#fff;text-decoration:underline}
.admin-layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid var(--beige-line);padding:16px 12px}
.admin-side .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 8px 6px}
.admin-side a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px}
.admin-side a:hover{background:var(--cream)}
.admin-side a.active{background:var(--beige);color:var(--brand-dark);font-weight:700}
.admin-side a.disabled{color:#b9b1a4;cursor:default}
.admin-main{padding:26px;background:var(--cream)}
.admin-main h1{font-size:26px;margin:0 0 2px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}
.kpi{background:#fff;border:1px solid var(--beige-line);border-radius:12px;padding:16px}
.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.kpi .big{font-size:26px;font-weight:700;margin-top:8px;font-family:Georgia,serif}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tag{background:var(--teal);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.panel{background:#fff;border:1px solid var(--beige-line);border-radius:12px;padding:18px;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--beige-line);white-space:nowrap}
.tbl th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tbl tr:hover td{background:var(--cream)}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:10px}
.bar{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .f{padding:6px 12px;border-radius:999px;border:1px solid var(--beige-line);background:#fff;cursor:pointer;font-size:13px}
.filters .f.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.cal{overflow-x:auto}
.cal table{border-collapse:collapse;font-size:12px}
.cal th,.cal td{border:1px solid var(--beige-line);padding:0;text-align:center;min-width:34px;height:34px}
.cal th.unit,.cal td.unit{text-align:left;padding:6px 10px;min-width:150px;white-space:nowrap;font-weight:600}
.cal .booked{background:var(--brand);color:#fff}
.cal .today{outline:2px solid var(--teal);outline-offset:-2px}
.cal table.pl{width:100%}
.pl th,.pl td{border:1px solid var(--beige-line);height:40px;min-width:42px;text-align:center;padding:0}
.pl th.pl-unit,.pl td.pl-unit{text-align:left;padding:6px 10px;min-width:180px;white-space:nowrap;font-weight:600;background:#fff;position:sticky;left:0;z-index:1}
.pl th.plday .n{font-weight:700;font-size:14px}.pl th.plday .m{font-size:10px;color:var(--muted)}.pl th.plday .w{font-size:10px;color:var(--muted)}
.pl .pl-today{background:#e6f5e6}
.pl td.pl-book{padding:0;text-align:left}
.pl .pl-inner{background:#35568a;color:#fff;border-radius:5px;margin:3px;padding:4px 7px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.pl .pl-soft_locked .pl-inner{background:#c99a3a}
.donut{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--brand) 0 100%);display:grid;place-items:center}
.donut .hole{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.admin-layout{grid-template-columns:1fr}.admin-side{display:flex;overflow-x:auto;gap:6px}.admin-side .grp{display:none}}
@media(max-width:820px){.searchbox{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CUR='€';
const UNITS=[
 {id:'u1',name:'Ringstrasse Studio',description:'A bright, compact studio steps from the historic Ring boulevard. Perfect for a couple exploring the city.',maxGuests:2,basePricePerNight:95,address:'Universitätsring 4, 1010 Vienna',photo:'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=900&q=70'},
 {id:'u2',name:'Belvedere Apartment',description:'Elegant one-bedroom with a small balcony near the Belvedere gardens. Quiet, classic, comfortable.',maxGuests:3,basePricePerNight:130,address:'Prinz-Eugen-Strasse 12, 1030 Vienna',photo:'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=900&q=70'},
 {id:'u3',name:'Naschmarkt Loft',description:'Spacious loft above the lively Naschmarkt. High ceilings, plenty of light, room for the whole family.',maxGuests:5,basePricePerNight:180,address:'Linke Wienzeile 40, 1060 Vienna',photo:'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=900&q=70'},
 {id:'u4',name:'Schönbrunn Retreat',description:'Calm two-bedroom near Schönbrunn Palace, with a leafy courtyard view. A restful base outside the centre.',maxGuests:4,basePricePerNight:150,address:'Grünbergstrasse 7, 1120 Vienna',photo:'https://images.unsplash.com/photo-1560185007-cde436f6a4d0?auto=format&fit=crop&w=900&q=70'}
];
const SEASONAL=[{unitId:'u2',from:'2026-06-01',to:'2026-08-31',price:165},{unitId:'u3',from:'2026-12-01',to:'2026-12-27',price:240}];
const CODES=[{code:'WELCOME10',type:'percent',value:10,from:'2026-01-01',to:'2026-12-31',minNights:2},{code:'STAY50',type:'fixed',value:50,from:'2026-01-01',to:'2026-12-31',minNights:3}];

const D=s=>new Date(s+'T00:00:00');
const nights=(a,b)=>Math.round((D(b)-D(a))/86400000);
const overlap=(ai,ao,bi,bo)=>D(ai)<D(bo)&&D(ao)>D(bi);
const iso=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)};
const TODAY=iso(0);
const fmt=s=>s?D(s).toLocaleDateString(LOCALE(),{day:'numeric',month:'short',year:'numeric'}):'';
const fmtShort=s=>s?D(s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}):'';
const getUnit=id=>UNITS.find(u=>u.id===id);
function nightly(u,day){for(const r of SEASONAL){if(r.unitId===u.id&&D(day)>=D(r.from)&&D(day)<=D(r.to))return r.price}return u.basePricePerNight}
function priceForStay(u,ci,co){let t=0,c=D(ci),e=D(co);while(c<e){t+=nightly(u,c.toISOString().slice(0,10));c.setDate(c.getDate()+1)}return t}
function comboPrice(ids,ci,co){return ids.reduce((s,id)=>s+priceForStay(getUnit(id),ci,co),0)}
function validateDiscount(codeStr,n,sub){const code=(codeStr||'').trim().toUpperCase();if(!code)return{ok:false,reason:L('Enter a code.','Bitte Code eingeben.')};const dc=CODES.find(c=>c.code===code);if(!dc||dc.active===false)return{ok:false,reason:L('This code is not valid.','Dieser Code ist ungültig.')};const now=new Date();if(now<D(dc.from)||now>D(dc.to))return{ok:false,reason:L('This code has expired.','Dieser Code ist abgelaufen.')};if(n<dc.minNights)return{ok:false,reason:L('This code needs at least '+dc.minNights+' nights.','Dieser Code erfordert mindestens '+dc.minNights+' Nächte.')};const amount=dc.type==='percent'?Math.round(sub*dc.value/100):Math.min(dc.value,sub);return{ok:true,code:dc.code,amount,label:dc.type==='percent'?dc.value+'%'+L(' off',' Rabatt'):CUR+dc.value+L(' off',' Rabatt')}}

const KEY='vienna-stay-bookings-v2';
const loadB=()=>{try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}};
const saveB=b=>localStorage.setItem(KEY,JSON.stringify(b));
const makeRef=()=>'VS-'+Math.random().toString(36).slice(2,7).toUpperCase();
const blocks=b=>b.status==='confirmed'||(b.status==='soft_locked'&&new Date(b.lockExpiresAt)>new Date());
const unitBusy=(uid,ci,co,ex)=>bookings.some(b=>b.id!==ex&&blocks(b)&&b.unitIds.includes(uid)&&overlap(ci,co,b.checkIn,b.checkOut));
const availableUnits=(ci,co)=>UNITS.filter(u=>!unitBusy(u.id,ci,co));
function buildOptions(ci,co,guests){
 const avail=availableUnits(ci,co);
 const singles=avail.filter(u=>u.maxGuests>=guests).sort((a,b)=>priceForStay(a,ci,co)-priceForStay(b,ci,co));
 if(singles.length)return singles.map(u=>({type:'single',unitIds:[u.id],units:[u],capacity:u.maxGuests,total:priceForStay(u,ci,co)}));
 const sorted=[...avail].sort((a,b)=>b.maxGuests-a.maxGuests);
 const chosen=[];let cap=0;
 for(const u of sorted){chosen.push(u);cap+=u.maxGuests;if(cap>=guests)break}
 if(cap>=guests)return[{type:'combo',unitIds:chosen.map(u=>u.id),units:chosen,capacity:cap,total:chosen.reduce((s,u)=>s+priceForStay(u,ci,co),0)}];
 return[];
}

function seed(){
 const mk=(unitIds,ci,co,guests,name,email,status)=>{const n=nights(ci,co);const sub=comboPrice(unitIds,ci,co);return{id:'seed'+Math.random().toString(36).slice(2,8),ref:makeRef(),status,lockExpiresAt:null,createdAt:new Date().toISOString(),unitIds,checkIn:ci,checkOut:co,nights:n,guests,subtotal:sub,discountCode:null,discountAmount:0,total:sub,guestName:name,guestEmail:email,guestPhone:'+43 660 000000',paidAt:new Date().toISOString()}};
 return[
  mk(['u2'],iso(0),iso(3),3,'Anna Weber','anna@example.com','confirmed'),
  mk(['u1'],iso(-2),iso(0),2,'Liam Murphy','liam@example.com','confirmed'),
  mk(['u4'],iso(5),iso(9),4,'Sofia Rossi','sofia@example.com','confirmed'),
  mk(['u3'],iso(9),iso(13),5,'The Nguyen Family','nguyen@example.com','confirmed'),
  mk(['u3','u4'],iso(18),iso(22),8,'Cohen Group','cohen@example.com','confirmed'),
  mk(['u1'],iso(-12),iso(-9),2,'Emma Schmidt','emma@example.com','confirmed'),
  mk(['u2'],iso(25),iso(28),2,'Noah Becker','noah@example.com','cancelled')
 ];
}
let bookings=[];
/* ===== SUPABASE (live shared data) ===== */
const SB_URL='https://rsqpcyuyoizakuxdevph.supabase.co/rest/v1';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzcXBjeXV5b2l6YWt1eGRldnBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODU0NTQsImV4cCI6MjEwMzA2MTQ1NH0.9PmOR8WBOma2LTQ6TG3iYeOSeXJ54ZAjk5sSm0z1ULg';
const SB_H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
async function sbGet(q){try{const r=await fetch(SB_URL+'/'+q,{headers:SB_H});return r.ok?await r.json():[]}catch(e){return[]}}
function sbInsert(t,row){return fetch(SB_URL+'/'+t,{method:'POST',headers:Object.assign({},SB_H,{Prefer:'return=minimal'}),body:JSON.stringify(row)}).catch(function(){})}
function sbPatch(t,col,val,patch){return fetch(SB_URL+'/'+t+'?'+col+'=eq.'+encodeURIComponent(val),{method:'PATCH',headers:Object.assign({},SB_H,{Prefer:'return=minimal'}),body:JSON.stringify(patch)}).catch(function(){})}
function sbDelete(t,col,val){return fetch(SB_URL+'/'+t+'?'+col+'=eq.'+encodeURIComponent(val),{method:'DELETE',headers:SB_H}).catch(function(){})}
const uFromDb=u=>({id:u.id,name:u.name,description:u.description,maxGuests:u.max_guests,basePricePerNight:Number(u.base_price_per_night),address:u.address,photo:u.photo,active:u.active});
const sFromDb=r=>({id:r.id,unitId:r.unit_id,from:r.from_date,to:r.to_date,price:Number(r.price)});
const cFromDb=c=>({code:c.code,type:c.type,value:Number(c.value),from:c.from_date,to:c.to_date,minNights:c.min_nights,active:c.active});

 </div>

}

function admCalendar(){
 const days=[];for(let i=-1;i<20;i++)days.push(iso(i));
 const wd=d=>D(d).toLocaleDateString('en-GB',{weekday:'short'});
 const mo=d=>D(d).toLocaleDateString('en-GB',{month:'short'});
 const head=days.map(d=>`<th class="plday ${d===TODAY?'pl-today':''}"><div class="w">${wd(d)}</div><div class="n">${D(d).getDate()}</div><div class="m">${mo(d)}</div></th>`).join('');
 const rows=UNITS.map(u=>{
  let cells='',i=0;
  while(i<days.length){
   const day=days[i];
   const b=bookings.find(bk=>blocks(bk)&&bk.unitIds.includes(u.id)&&D(day)>=D(bk.checkIn)&&D(day)<D(bk.checkOut));
   if(b){let j=i;while(j<days.length&&D(days[j])>=D(b.checkIn)&&D(days[j])<D(b.checkOut))j++;const span=j-i;cells+=`<td colspan="${span}" class="pl-book pl-${b.status}"><div class="pl-inner" title="${esc(b.guestName||'')} · ${fmt(b.checkIn)}→${fmt(b.checkOut)}">${esc(b.guestName||'—')} · ${b.guests}p · ${CUR}${b.total} · ${esc(b.source||'DIRECT')}</div></td>`;i=j;}
   else{cells+=`<td class="${day===TODAY?'pl-today':''}"></td>`;i++;}
  }
  return `<tr><td class="pl-unit">${esc(u.name)} <span class="muted">(${u.maxGuests})</span></td>${cells}</tr>`;
 }).join('');
 return `<h1>Planning calendar</h1><div class="muted">Every apartment × every day. Each bar is a booking, stretched from check-in to check-out — synced live with the site. Today is highlighted.</div>

}

  <div class="panel"><strong>Base price per night</strong><table class="tbl" style="margin-top:8px"><thead><tr><th>Apartment</th><th>Price</th></tr></thead><tbody>${unitRows}</tbody></table></div>
  <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Seasonal rates</strong><button class="btn btn-sm" onclick="addSeason()">+ Add seasonal rate</button></div><table class="tbl" style="margin-top:8px"><thead><tr><th>Apartment</th><th>Period</th><th>Price / night</th><th></th></tr></thead><tbody>${seasonRows||'<tr><td colspan=4 class="muted">No seasonal rates yet.</td></tr>'}</tbody></table></div>
  <div class="panel"><strong>Discount codes</strong><table class="tbl" style="margin-top:8px"><thead><tr><th>Code</th><th>Discount</th><th>Rule</th><th>Status</th><th></th></tr></thead><tbody>${codeRows}</tbody></table></div>`;
}
async function delSeason(id){await sbDelete('seasonal_rates','id',id);await reloadSeasons();render()}
async function toggleCode(i){const c=CODES[i];const na=c.active===false?true:false;c.active=na;await sbPatch('discount_codes','code',c.code,{active:na});render()}
async function addSeason(){const uid=prompt('Apartment id (u1, u2, u3, u4):','u1');if(!uid||!getUnit(uid)){if(uid)alert('Unknown apartment id.');return}const from=prompt('From date (YYYY-MM-DD):','2026-12-20');const to=prompt('To date (YYYY-MM-DD):','2026-12-31');const price=parseInt(prompt('Price per night:','200'));if(from&&to&&price){await sbInsert('seasonal_rates',{unit_id:uid,from_date:from,to_date:to,price});await reloadSeasons();render()}}

function admGuests(){
 const map={};bookings.forEach(b=>{if(!b.guestEmail)return;const k=b.guestEmail.toLowerCase();if(!map[k])map[k]={name:b.guestName,email:b.guestEmail,phone:b.guestPhone,count:0,spent:0};map[k].count++;if(b.status==='confirmed')map[k].spent+=b.total});
 const list=Object.values(map);
 const rows=list.map(g=>`<tr><td>${esc(g.name||'—')}</td><td>${esc(g.email)}</td><td>${esc(g.phone||'—')}</td><td>${g.count}</td><td>${CUR}${g.spent.toLocaleString()}</td></tr>`).join('');
 return `<h1>Guests</h1><div class="muted">Everyone who has booked — built automatically from reservations.</div>
  <div class="panel"><strong>${list.length} guests</strong><div style="overflow-x:auto"><table class="tbl" style="margin-top:8px"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Bookings</th><th>Spent</th></tr></thead><tbody>${rows||'<tr><td colspan=5 class="muted">No guests yet.</td></tr>'}</tbody></table></div></div>`;
}

function admTasks(){
 const rows=TASKS.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--beige-line)"><input type="checkbox" ${t.done?'checked':''} onclick="toggleTask(${t.id})"><span style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.text)}</span><button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="delTask(${t.id})">✕</button></div>`).join('');
 return `<h1>Tasks</h1><div class="muted">Your operational to-do list — cleaning, check-ins, guest messages.</div>
  <div class="panel"><div class="promo-row" style="margin-bottom:10px"><input id="newtask" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask()"><button class="btn" onclick="addTask()">Add</button></div>${rows||'<p class="muted">No tasks.</p>'}</div>`;
}
function addTask(){const el=document.getElementById('newtask');const v=el.value.trim();if(!v)return;TASKS.push({id:Date.now(),text:v,done:false});saveTasks();render()}
function toggleTask(id){const t=TASKS.find(x=>x.id===id);t.done=!t.done;saveTasks();render()}
function delTask(id){TASKS=TASKS.filter(x=>x.id!==id);saveTasks();render()}

function admInvoices(){
 const conf=bookings.filter(b=>b.status==='confirmed').sort((a,b)=>D(b.checkIn)-D(a.checkIn));
 const rows=conf.map(b=>`<tr><td>INV-${b.ref.replace('VS-','')}</td><td>${esc(b.guestName||'—')}</td><td>${fmt(b.paidAt?b.paidAt.slice(0,10):b.checkIn)}</td><td>${CUR}${b.total}</td><td><span class="badge confirmed">Paid</span></td><td><button class="btn btn-ghost btn-sm" onclick="alert('Invoice ${b.ref} — PDF download (demo).')">Download</button></td></tr>`).join('');
 const total=conf.reduce((s,b)=>s+b.total,0);
 return `<h1>Invoices</h1><div class="muted">One invoice per paid booking. Total collected: <strong>${CUR}${total.toLocaleString()}</strong>.</div>
  <div class="panel"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Invoice</th><th>Guest</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=6 class="muted">No invoices yet.</td></tr>'}</tbody></table></div></div>`;
}

function admChannels(){
 const rows=CHANNELS.map((c,i)=>`<tr><td><strong>${c.n}</strong></td><td>${c.on?'<span class="badge confirmed">Connected</span>':'<span class="muted">Not connected</span>'}</td><td><button class="btn btn-ghost btn-sm" onclick="toggleChannel(${i})">${c.on?'Disconnect':'Connect'}</button></td></tr>`).join('');
 return `<h1>Channel manager</h1><div class="muted">Sync availability & prices with travel sites. When connected, a booking on any channel blocks those dates everywhere — no double bookings.</div>
  <div class="notice" style="background:#eef3ec;border-color:#cfe0cd;color:#3f5f45;margin-top:14px">This is the (e) feature from your plan. In the live system it connects through the real Booking.com / Airbnb APIs. Here you can see and try how it will work.</div>
  <div class="panel"><table class="tbl"><thead><tr><th>Channel</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function toggleChannel(i){CHANNELS[i].on=!CHANNELS[i].on;render()}

function admReports(){
 const conf=bookings.filter(b=>b.status==='confirmed');
 const revenue=conf.reduce((s,b)=>s+b.total,0);
 const persons=conf.reduce((s,b)=>s+b.guests,0);
 const avg=conf.length?Math.round(revenue/conf.length):0;
 let occDays=0;const totalDays=UNITS.length*30;
 for(const u of UNITS){for(let i=0;i<30;i++){const d=iso(i);if(conf.some(b=>b.unitIds.includes(u.id)&&D(d)>=D(b.checkIn)&&D(d)<D(b.checkOut)))occDays++}}
 const occ=Math.round(occDays/totalDays*100);
 const byUnit=UNITS.map(u=>{const bs=conf.filter(b=>b.unitIds.includes(u.id));const rev=bs.reduce((s,b)=>s+Math.round(b.total/b.unitIds.length),0);return{u,count:bs.length,rev}}).sort((a,b)=>b.rev-a.rev);
 return `<h1>Reports</h1><div class="muted">Performance at a glance — from live booking data.</div>
  <div class="kpi-grid"><div class="kpi"><div class="label">Total revenue</div><div class="big">${CUR}${revenue.toLocaleString()}</div></div><div class="kpi"><div class="label">Confirmed bookings</div><div class="big">${conf.length}</div><div class="sub">${persons} guests</div></div><div class="kpi"><div class="label">Avg booking value</div><div class="big">${CUR}${avg}</div></div><div class="kpi"><div class="label">Occupancy (30d)</div><div class="big">${occ}%</div></div></div>
  <div class="panel"><strong>Revenue by apartment</strong><table class="tbl" style="margin-top:8px"><thead><tr><th>Apartment</th><th>Bookings</th><th>Revenue</th></tr></thead><tbody>${byUnit.map(x=>`<tr><td>${esc(x.u.name)}</td><td>${x.count}</td><td>${CUR}${x.rev.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`;
}

function admSettings(){
 return `<h1>Settings</h1><div class="muted">Property details and booking rules.</div>
  <div class="panel"><strong>Property</strong><div class="form-grid" style="margin-top:10px"><div><label class="lbl">Name</label><input class="ctrl" value="Vienna Stay Apartments"></div><div><label class="lbl">Currency</label><input class="ctrl" value="EUR (€)"></div><div class="full"><label class="lbl">Address</label><input class="ctrl" value="Vienna, Austria"></div></div></div>
  <div class="panel"><strong>Booking rules</strong><div class="form-grid" style="margin-top:10px"><div><label class="lbl">Minimum nights</label><input class="ctrl" value="2"></div><div><label class="lbl">Hold time (minutes)</label><input class="ctrl" value="10"></div><div><label class="lbl">Payment</label><input class="ctrl" value="Full prepayment"></div><div><label class="lbl">Cancellation</label><input class="ctrl" value="No refund"></div></div></div>
  <div class="panel"><strong>Manager login</strong><div class="form-grid" style="margin-top:10px"><div><label class="lbl">Username</label><input class="ctrl" value="manager"></div><div><label class="lbl">Password</label><input class="ctrl" type="password" value="vienna2026"></div></div><p class="muted" style="font-size:12px;margin-bottom:0">Demo — in the live system these are stored securely.</p></div>
  <div style="margin-top:12px"><button class="btn" onclick="alert('Settings saved (demo).')">Save changes</button></div>`;
}

/* TIMER */
function startTimer(){tick=setInterval(()=>{const s=remainSecs(),el=document.getElementById('tmr');if(s<=0){render();return}if(el){el.textContent='⏳ '+L('Held for','Reserviert für')+' '+mmss(s);el.className='timer'+(s<120?' warn':'')}},1000)}

document.addEventListener('click',function(){if(state.pickerOpen){state.pickerOpen=null;render()}});
render();loadAll();
</script>
